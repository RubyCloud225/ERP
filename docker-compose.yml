version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ERP_Backend/Dockerfile
    container_name: erp-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=erpdb;User Id=sa;Password=Your_password123;
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
    networks:
      - erp-network
  gateway:
    image: nginx:alpine
    container_name: erp-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - erp-network

  db:
    image: postgres:16-alpine
    container_name: erp-db
    environment:
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=Your_password123
      - POSTGRES_DB=erpdb
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d erpdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network
  frontend:
    build:
      context: ./ERP-Frontend
      dockerfile: Dockerfile
    container_name: erp-ui
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
    networks:
      - erp-network
networks:
  erp-network:
    driver: bridge
volumes:
  db-data: